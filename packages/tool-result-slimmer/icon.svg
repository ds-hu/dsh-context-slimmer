<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tool-result slimmer">
  <!-- Original artwork: a stack of tool-result cards where the older cards collapse
       into a single compact strip, while the newest card stays readable. -->
  <defs>
    <linearGradient id="ts-tile" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0B1A"/>
      <stop offset="0.6" stop-color="#1A1733"/>
      <stop offset="1" stop-color="#332A63"/>
    </linearGradient>
    <linearGradient id="ts-live" x1="22" y1="10" x2="54" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8E6BFF"/>
      <stop offset="1" stop-color="#5EE6C8"/>
    </linearGradient>
    <linearGradient id="ts-fold" x1="10" y1="42" x2="40" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EC9FF"/>
      <stop offset="1" stop-color="#8E6BFF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ts-tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <!-- newest, untouched card -->
  <rect x="21" y="11" width="33" height="18" rx="4.5" fill="url(#ts-live)" fill-opacity="0.16" stroke="url(#ts-live)" stroke-width="1.5"/>
  <path d="M27 17h21M27 21h14M27 25h18" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="1.8" stroke-linecap="round"/>
  <!-- collapsed older cards -->
  <path d="M12 37h40" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="42" width="36" height="5" rx="2.5" fill="url(#ts-fold)" fill-opacity="0.55"/>
  <rect x="18" y="50" width="28" height="4" rx="2" fill="url(#ts-fold)" fill-opacity="0.32"/>
</svg>
