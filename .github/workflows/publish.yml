# Publish the three npm packages of the dsh-context-slimmer bundle and create the
# matching GitHub Release.
#
# Trigger:
#   * push a tag `v<version>` (must match the root package.json version),
#   * or run this workflow manually with `dry_run: true` (default) to rehearse
#     packing/publishing without touching the registry.
#
# Publish order is dependency order:
#   1. @ds-hu/dsh-context-slimmer-core
#   2. @ds-hu/dsh-context-slimmer-tool-result
#   3. @ds-hu/dsh-context-slimmer (the bundle package)
#
# Guard before publishing:
#   * the tag matches the root version,
#   * the offline tests pass,
#   * `scan-secrets.sh --publish` finds no credential material in tracked files or
#     packed tarballs (no sk-*, npm_*, _authToken, NPM_TOKEN=<value>, private keys),
#   * `npm pack --dry-run` succeeds for every package,
#   * a version that is already on the registry is skipped (idempotent re-runs).
#
# The GitHub Release attaches the two screenshots from the latest successful
# `verify` run on the main branch (best effort; a missing artifact never blocks
# publishing).
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0); required when dry_run is false
        required: false
        type: string
        default: ''
      dry_run:
        description: Rehearse packing/publishing without touching npm or GitHub Releases
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish npm packages + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "no package-lock.json; falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Resolve version and target tag
        id: release
        run: |
          set -euo pipefail
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -n "$tag" ]; then
            tag_version="${tag#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "ERROR: tag $tag does not match package.json version $version" >&2
              exit 1
            fi
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "ERROR: a tag (v$version) is required for a real publish; set dry_run=true to rehearse" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version tag=${tag:-<none>} dry_run=${{ inputs.dry_run }}"

      - name: Offline tests
        run: |
          set -euo pipefail
          if ! node -e 'const p = require("./package.json"); process.exit(p.scripts && p.scripts.test ? 0 : 1)'; then
            echo "ERROR: no root test script" >&2
            exit 1
          fi
          npm test

      - name: Credential scan (tracked files + packed tarballs)
        run: |
          set -euo pipefail
          bash scripts/ci/scan-secrets.sh --publish

      - name: Pack dry-run for every package
        run: |
          set -euo pipefail
          for dir in packages/core packages/tool-result-slimmer .; do
            echo "--- npm pack --dry-run in $dir"
            ( cd "$dir" && npm pack --dry-run --json >/dev/null )
          done
          echo "all packages pack cleanly"

      - name: Publish packages in dependency order
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ "${DRY_RUN}" != "false" ]; then
            extra+=(--dry-run)
            echo "DRY RUN: npm publish will not touch the registry"
          fi
          for dir in packages/core packages/tool-result-slimmer .; do
            name="$(node -e "process.stdout.write(require('./$dir/package.json').name)")"
            version="$(node -e "process.stdout.write(require('./$dir/package.json').version)")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version}: already published"
              continue
            fi
            echo "publishing ${name}@${version} (${dir})"
            ( cd "$dir" && npm publish --access public --provenance=false "${extra[@]}" )
          done

      - name: Collect verification screenshots for the release
        id: evidence
        if: steps.release.outputs.tag != '' && steps.release.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-artifacts"
          run_id="$(gh run list --workflow verify.yml --branch main --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId' 2>/dev/null || true)"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "no successful verify run found on main; the release will be created without screenshots"
            exit 0
          fi
          echo "using verify run $run_id"
          if gh run download "$run_id" --pattern 'verify-evidence-*' --dir "$RUNNER_TEMP/verify-artifacts" 2>/dev/null; then
            find "$RUNNER_TEMP/verify-artifacts" -type f -name '*.png' -print
          else
            echo "could not download verify artifacts; continuing without screenshots"
          fi

      - name: Create or update GitHub Release
        if: steps.release.outputs.tag != '' && steps.release.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t screenshots < <(find "$RUNNER_TEMP/verify-artifacts" -type f -name '*.png' -print 2>/dev/null | head -2)
          notes_args=()
          if [ -f CHANGELOG.md ]; then
            notes_args=(--notes-file CHANGELOG.md)
          else
            notes_args=(--generate-notes)
          fi
          release_args=(
            "$TAG"
            --title "v${VERSION}"
            --target "$GITHUB_SHA"
            "${notes_args[@]}"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets with --clobber"
            if [ "${#screenshots[@]}" -gt 0 ]; then gh release upload "$TAG" "${screenshots[@]}" --clobber; fi
          else
            if [ "${#screenshots[@]}" -gt 0 ]; then
              gh release create "${release_args[@]}" "${screenshots[@]}"
            else
              gh release create "${release_args[@]}"
            fi
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Publish"
            echo
            echo "- version: ${{ steps.release.outputs.version }}"
            echo "- tag: ${{ steps.release.outputs.tag }}"
            echo "- dry run: ${{ steps.release.outputs.dry_run }}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
